aid: innerspace
name: InnerSpace
description: InnerSpace (InnerSpace Technologies Inc.) is a workplace analytics company
  that measures how physical space is used by leveraging a building's existing Wi-Fi
  infrastructure rather than dedicated occupancy sensors. Its patented Predictive Hyperbolic
  Location Fingerprinting (PHLF) technology locates and counts people to within roughly
  four feet to reveal occupancy, movement, and space-utilization patterns across sites,
  buildings, floors, and zones. The InnerSpace platform serves hybrid-workplace management,
  real-estate portfolio optimization, higher-education, and employee-experience use
  cases for enterprises including Microsoft, KPMG, Indeed, and LinkedIn. A GraphQL API
  (v2) at api.innerspace.io exposes building, zone, site, floor, group, and insights
  data to customers with active contracts, authenticated via an OAuth 2.0 client-credentials
  exchange that returns a session token.
